<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATR动态止损计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .stock-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .stock-code {
            font-size: 14px;
            color: #888;
            background: #e0e0e0;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .info-value.price {
            color: #4CAF50;
        }

        .info-value.loss {
            color: #f44336;
        }

        .stop-loss-section {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(238, 90, 90, 0.3);
        }

        .stop-loss-title {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stop-loss-price {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stop-loss-distance {
            font-size: 16px;
            opacity: 0.9;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .form-row,
            .info-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            .stop-loss-price {
                font-size: 36px;
            }
        }

        .tooltip {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ ATR动态止损计算器</h1>
        <p class="subtitle">基于ATR指标的自适应止损价格计算工具</p>

        <form id="calcForm">
            <div class="form-group">
                <label for="stockCode">股票代码</label>
                <input
                    type="text"
                    id="stockCode"
                    placeholder="例如: 600000 或 600000.SH"
                    required
                >
                <div class="tooltip">支持6位数字代码或完整代码格式（如 600000.SH 或 000001.SZ）</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="atrPeriod">ATR周期</label>
                    <input
                        type="number"
                        id="atrPeriod"
                        value="14"
                        min="7"
                        max="30"
                    >
                    <div class="tooltip">通常使用14天</div>
                </div>

                <div class="form-group">
                    <label for="atrMultiplier">ATR倍数</label>
                    <input
                        type="number"
                        id="atrMultiplier"
                        value="2.0"
                        min="1.0"
                        max="5.0"
                        step="0.1"
                    >
                    <div class="tooltip">通常使用2-3倍</div>
                </div>
            </div>

            <button type="submit" id="calculateBtn">📊 计算止损价格</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在计算...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result" id="result">
            <div class="result-header">
                <span class="stock-name" id="stockName">股票名称</span>
                <span class="stock-code" id="stockCodeDisplay">股票代码</span>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">当前价格</div>
                    <div class="info-value price" id="currentPrice">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">期间最高价</div>
                    <div class="info-value" id="highestPrice">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">ATR值</div>
                    <div class="info-value" id="atrValue">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">收益率</div>
                    <div class="info-value" id="returnRatio">--</div>
                </div>
            </div>

            <div class="stop-loss-section">
                <div class="stop-loss-title">💥 建议止损价格</div>
                <div class="stop-loss-price" id="stopLossPrice">--</div>
                <div class="stop-loss-distance" id="stopLossDistance">--</div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('calcForm');
        const calculateBtn = document.getElementById('calculateBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const stockCode = document.getElementById('stockCode').value.trim();
            const atrPeriod = document.getElementById('atrPeriod').value;
            const atrMultiplier = document.getElementById('atrMultiplier').value;

            if (!stockCode) {
                showError('请输入股票代码');
                return;
            }

            // 显示加载状态
            loading.classList.add('show');
            result.classList.remove('show');
            errorMessage.classList.remove('show');
            calculateBtn.disabled = true;

            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        stock_code: stockCode,
                        atr_period: parseInt(atrPeriod),
                        atr_multiplier: parseFloat(atrMultiplier)
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data.data);
                } else {
                    showError(data.error || '计算失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                loading.classList.remove('show');
                calculateBtn.disabled = false;
            }
        });

        function displayResult(data) {
            document.getElementById('stockName').textContent = data.stock_name;
            document.getElementById('stockCodeDisplay').textContent = data.stock_code;
            document.getElementById('currentPrice').textContent = '¥' + data.current_price.toFixed(2);
            document.getElementById('highestPrice').textContent = '¥' + data.highest_price.toFixed(2);
            document.getElementById('atrValue').textContent = '¥' + data.atr.toFixed(2);
            document.getElementById('returnRatio').textContent = data.return_ratio.toFixed(2) + '%';
            document.getElementById('stopLossPrice').textContent = '¥' + data.stop_loss_price.toFixed(2);
            document.getElementById('stopLossDistance').textContent =
                `距离最高价 ${data.distance_percent.toFixed(2)}% (ATR周期${data.atr_period}天, 倍数${data.atr_multiplier})`;

            // 根据收益率设置颜色
            const returnRatioEl = document.getElementById('returnRatio');
            if (data.return_ratio >= 0) {
                returnRatioEl.classList.add('price');
                returnRatioEl.classList.remove('loss');
            } else {
                returnRatioEl.classList.add('loss');
                returnRatioEl.classList.remove('price');
            }

            result.classList.add('show');
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
            result.classList.remove('show');
        }
    </script>
</body>
</html>
